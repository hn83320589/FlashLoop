name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore FlashLoop.sln

      - name: Build
        run: dotnet build FlashLoop.sln -c Release --no-restore

      - name: Test
        run: dotnet test FlashLoop.sln -c Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Test summary
        if: always()
        shell: pwsh
        run: |
          "| 測試專案 | 通過 | 失敗 | 總計 |" >> $env:GITHUB_STEP_SUMMARY
          "|---|---:|---:|---:|" >> $env:GITHUB_STEP_SUMMARY
          Get-ChildItem tests -Recurse -Filter *.trx | Sort-Object FullName | ForEach-Object {
            [xml]$trx = Get-Content $_.FullName
            $c = $trx.TestRun.ResultSummary.Counters
            "| $($_.Directory.Parent.Name) | $($c.passed) | $($c.failed) | $($c.total) |" >> $env:GITHUB_STEP_SUMMARY
          }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: tests/**/TestResults/*.trx
